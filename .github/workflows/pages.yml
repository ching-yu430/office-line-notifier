name: 手動核准後發布 GitHub Pages
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 已核對測試與隱私，輸入「確認公開」
        required: true
        type: string
      mode:
        description: 發布模式（整合前請選 mock）
        required: true
        default: mock
        type: choice
        options:
          - mock
          - supabase
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: inputs.confirmation == '確認公開'
    runs-on: ubuntu-latest
    env:
      VITE_APP_MODE: ${{ inputs.mode }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/office-line-notifier/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 檢查公開設定
        if: inputs.mode == 'supabase'
        run: node -e "for(const k of ['VITE_SUPABASE_URL','VITE_SUPABASE_PUBLISHABLE_KEY','VITE_BASE_PATH'])if(!process.env[k])throw Error('缺少 '+k)"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 發布（請在 environment 設定必要審核者）
        id: deployment
        uses: actions/deploy-pages@v4
