# 保留舊展示頁的手動建置能力；正式服務請使用 README 的 Cloudflare Pages 流程。
name: 手動核准後發布 GitHub 展示版
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 僅發布虛構資料展示版，輸入「確認公開」
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: inputs.confirmation == '確認公開'
    runs-on: ubuntu-latest
    env:
      VITE_APP_MODE: mock
      VITE_BASE_PATH: /office-line-notifier/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
